name: Release packages

# Every v* tag: the Linux build, a .deb and a .flatpak, the Windows installer and zip, the Android .apk (and the .aab for Google Play),
# the macOS .dmg/.zip and an unsigned iOS .ipa, attached to the GitHub release,
# and the app added to our Flatpak repository on GitHub Pages (packaging/flatpak/publish-repo.sh).
# Run by hand to just build them (artifacts of the run), or to also publish to the Flatpak repository.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the Flatpak repository
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40  # a hung download (e.g. Flathub) must not block the release for hours
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        run: echo "version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Linux build dependencies (Flutter desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev
      - run: pip install "flet[all]==1.1.2"
      - name: flet build linux
        run: flet build linux --yes --no-rich-output --skip-flutter-doctor
      - name: Tarball and .deb
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p dist staging
          cp -a build/linux "staging/aprs-kiss-$V"
          tar -C staging -czf "dist/aprs-kiss-$V-linux-x86_64.tar.gz" "aprs-kiss-$V"
          packaging/deb/build-deb.sh build/linux "$V" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a hung download (e.g. Flathub) must not block the release for hours
    env:
      ID: io.github.michalsiman.aprs_kiss_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - run: cp dist/aprs-kiss-*-linux-x86_64.tar.gz dist/aprs-kiss-linux-x86_64.tar.gz
      - name: flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --default-branch=stable --repo=repo build-dir packaging/flatpak/$ID.yml
          # Installed from this file, the app still gets updates from our repository.
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            --repo-url=https://michalsiman.github.io/aprs-kiss-app/repo/ \
            --gpg-keys=packaging/flatpak/aprs-kiss.gpg \
            repo "aprs-kiss-${{ needs.linux.outputs.version }}-x86_64.flatpak" $ID stable
      - name: Publish to the Flatpak repository (GitHub Pages)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          VERSION: ${{ needs.linux.outputs.version }}
          GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: packaging/flatpak/publish-repo.sh repo
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: "*.flatpak"

  windows:
    runs-on: windows-latest
    timeout-minutes: 40  # a hung download (e.g. Flathub) must not block the release for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet[all]==1.1.2"
      - name: flet build windows
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: flet build windows --yes --no-rich-output --skip-flutter-doctor
      - name: Zip and installer
        shell: pwsh
        run: |
          $v = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          Get-ChildItem build\windows | Format-Table Name, Length
          $exe = (Get-ChildItem build\windows -Filter *.exe | Select-Object -First 1).Name
          if (-not $exe) { throw "No .exe in build\windows" }
          Write-Host "Version $v, program $exe"
          New-Item -ItemType Directory -Force dist, staging | Out-Null
          Copy-Item -Recurse build\windows "staging\aprs-kiss-$v"
          Compress-Archive -Path "staging\aprs-kiss-$v" -DestinationPath "dist\aprs-kiss-$v-windows-x64.zip"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" "/DSource=..\..\build\windows" "/DExe=$exe" "/DOut=..\..\dist" packaging\windows\aprs-kiss.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # a hung download (e.g. Flathub) must not block the release for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install "flet[all]==1.1.2"
      - name: flet build apk (GitHub) and aab (Google Play)
        # Signed with the project's own key (secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD), so each
        # release installs over the previous one; without the secrets a throwaway key is used, and no .aab is
        # made (Google Play needs the same upload key every time).
        # The build number (Android's versionCode) grows with the version: 0.1.28 -> 1028; Google Play
        # refuses an upload whose number is not higher than the last one.
        # The Python-for-Android download now and then breaks off: one more try before giving up.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          BUILD=$(python -c "a,b,c=map(int,'$V'.split('.')); print(a*1000000+b*1000+c)")
          SIGN=()
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            SIGN=(--android-signing-key-store "$RUNNER_TEMP/release.jks" --android-signing-key-alias aprs-kiss
                  --android-signing-key-store-password "$KEYSTORE_PASSWORD" --android-signing-key-password "$KEYSTORE_PASSWORD")
          else
            echo "::warning::No Android signing key in the secrets: the .apk is signed with a throwaway key, no .aab"
          fi
          build() {
            flet build "$1" --yes --no-rich-output --skip-flutter-doctor --build-number "$BUILD" "${SIGN[@]}" || {
              echo "Retrying the Android build"; sleep 30
              flet build "$1" --yes --no-rich-output --skip-flutter-doctor --build-number "$BUILD" "${SIGN[@]}"; }
          }
          mkdir -p dist
          build apk
          ls -la build/apk
          cp "$(ls build/apk/*.apk | head -1)" "dist/aprs-kiss-$V-android.apk"
          if [ -n "$KEYSTORE_B64" ]; then
            # The Google Play build: no new-version check, Google Play updates it (aprs_kiss_app/distribution.py)
            sed -i 's/^CHANNEL = "github"$/CHANNEL = "play"/' src/aprs_kiss_app/distribution.py
            grep -q '^CHANNEL = "play"$' src/aprs_kiss_app/distribution.py
            build aab
            ls -la build/aab
            cp "$(ls build/aab/*.aab | head -1)" "dist/aprs-kiss-$V-google-play.aab"
            git checkout src/aprs_kiss_app/distribution.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  macos:
    runs-on: macos-26
    timeout-minutes: 45  # a hung download (e.g. Flathub) must not block the release for hours
    steps:
      - uses: actions/checkout@v4
      # Flet's plugins (connectivity_plus) need the macOS/iOS 26 SDK, i.e. Xcode 26.
      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet[all]==1.1.2"
      - name: flet build macos
        run: flet build macos --yes --no-rich-output --skip-flutter-doctor
      - name: Disk image and zip
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          ls -la build/macos
          APP=$(ls -d build/macos/*.app | head -1)
          mkdir -p dist dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "APRS & Packet $V" -srcfolder dmg -ov -format UDZO "dist/aprs-kiss-$V-macos.dmg"
          ditto -c -k --keepParent "$APP" "dist/aprs-kiss-$V-macos.zip"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  ios:
    runs-on: macos-26
    timeout-minutes: 45  # a hung download (e.g. Flathub) must not block the release for hours
    steps:
      - uses: actions/checkout@v4
      # Flet's plugins (connectivity_plus) need the macOS/iOS 26 SDK, i.e. Xcode 26.
      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet[all]==1.1.2"
      # Without an Apple developer account the app cannot be signed here: this makes an unsigned .ipa,
      # which sideloading tools (AltStore, Sideloadly) sign with the user's own Apple ID.
      - name: flet build ipa (unsigned)
        run: flet build ipa --yes --no-rich-output --skip-flutter-doctor || echo "flet build ipa ended with $?"
      - name: Unsigned .ipa
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          find build -maxdepth 6 \( -name "*.ipa" -o -name "*.xcarchive" -o -name "Runner.app" \) -print || true
          APP=$(find build -path "*Products/Applications/*.app" -maxdepth 8 | head -1)
          if [ -z "$APP" ]; then
            (cd build/flutter && flutter build ios --release --no-codesign) || true
            APP=$(find build/flutter/build/ios -name "*.app" -maxdepth 4 | head -1)
          fi
          test -n "$APP"
          echo "App: $APP"
          mkdir -p dist ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qr "../dist/aprs-kiss-$V-ios-unsigned.ipa" Payload)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  release:
    # A failing build (a hung Flatpak download, the macOS disk image…) leaves its file out instead of
    # stopping the release: the Linux and Windows builds are what it needs.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.linux.result == 'success'
      && needs.windows.result == 'success'
    needs: [linux, flatpak, windows, android, macos, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - run: find out -type f
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            out/linux/*.tar.gz
            out/linux/*.deb
            out/flatpak/*.flatpak
            out/windows/*.exe
            out/windows/*.zip
            out/android/*.apk
            out/android/*.aab
            out/macos/*.dmg
            out/macos/*.zip
            out/ios/*.ipa
