name: Release packages

# Every v* tag: the Linux build, a .deb and a .flatpak, the Windows installer and zip, attached to the GitHub release,
# and the app added to our Flatpak repository on GitHub Pages (packaging/flatpak/publish-repo.sh).
# Run by hand to just build them (artifacts of the run), or to also publish to the Flatpak repository.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the Flatpak repository
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        run: echo "version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Linux build dependencies (Flutter desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev
      - run: pip install "flet[all]==1.1.2"
      - name: flet build linux
        run: flet build linux --yes --no-rich-output --skip-flutter-doctor
      - name: Tarball and .deb
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p dist staging
          cp -a build/linux "staging/aprs-kiss-$V"
          tar -C staging -czf "dist/aprs-kiss-$V-linux-x86_64.tar.gz" "aprs-kiss-$V"
          packaging/deb/build-deb.sh build/linux "$V" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    env:
      ID: io.github.michalsiman.aprs_kiss_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - run: cp dist/aprs-kiss-*-linux-x86_64.tar.gz dist/aprs-kiss-linux-x86_64.tar.gz
      - name: flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --default-branch=stable --repo=repo build-dir packaging/flatpak/$ID.yml
          # Installed from this file, the app still gets updates from our repository.
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            --repo-url=https://michalsiman.github.io/aprs-kiss-app/repo/ \
            --gpg-keys=packaging/flatpak/aprs-kiss.gpg \
            repo "aprs-kiss-${{ needs.linux.outputs.version }}-x86_64.flatpak" $ID stable
      - name: Publish to the Flatpak repository (GitHub Pages)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          VERSION: ${{ needs.linux.outputs.version }}
          GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: packaging/flatpak/publish-repo.sh repo
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: "*.flatpak"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet[all]==1.1.2"
      - name: flet build windows
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: flet build windows --yes --no-rich-output --skip-flutter-doctor
      - name: Zip and installer
        shell: pwsh
        run: |
          $v = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          Get-ChildItem build\windows | Format-Table Name, Length
          $exe = (Get-ChildItem build\windows -Filter *.exe | Select-Object -First 1).Name
          if (-not $exe) { throw "No .exe in build\windows" }
          Write-Host "Version $v, program $exe"
          New-Item -ItemType Directory -Force dist, staging | Out-Null
          Copy-Item -Recurse build\windows "staging\aprs-kiss-$v"
          Compress-Archive -Path "staging\aprs-kiss-$v" -DestinationPath "dist\aprs-kiss-$v-windows-x64.zip"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" "/DSource=..\..\build\windows" "/DExe=$exe" "/DOut=..\..\dist" packaging\windows\aprs-kiss.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, flatpak, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - run: find out -type f
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/linux/*.tar.gz
            out/linux/*.deb
            out/flatpak/*.flatpak
            out/windows/*.exe
            out/windows/*.zip
