name: Build Linux app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux build dependencies (Flutter desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev
      - run: pip install "flet[all]==1.1.2"
      - name: flet build linux
        run: flet build linux --yes --no-rich-output --skip-flutter-doctor
      - name: Pack
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tar -C build/linux -czf aprs-kiss-${VERSION}-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: aprs-kiss-linux-x86_64
          path: aprs-kiss-*-linux-x86_64.tar.gz
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aprs-kiss-*-linux-x86_64.tar.gz
