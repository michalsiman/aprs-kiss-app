[project]
name = "aprs-kiss"
version = "0.1.43"
description = "APRS station and packet radio terminal for a KISS TNC, for computers and phones"
readme = "README.md"
license = "MIT"
authors = [{ name = "Michal Šiman (OK1SIM)" }]
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-map==1.1.2",
    "flet-geolocator==1.1.2",  # the phone's own GPS (Android, iOS)
    "flet-audio==1.1.2",  # beeps on transmit and new messages
    "aprslib>=0.7.2",
    "platformdirs>=4",
    "certifi",  # HTTPS certificates for the update check on Android and iOS
    "tomli>=2; python_version < '3.11'",
    "pyserial-asyncio-fast>=0.16; sys_platform == 'linux' or sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Running with plain Python (pip/pipx) needs the desktop client; `flet build` bundles its own.
desktop = ["flet-desktop==1.1.2"]
dev = ["flet[all]==1.1.2"]

[project.scripts]
aprs-kiss = "aprs_kiss_app.cli:run"

[project.urls]
Homepage = "https://github.com/michalsiman/aprs-kiss-app"
"Home Assistant integration" = "https://github.com/michalsiman/aprs-kiss-ha"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aprs_kiss_app = ["icon.png", "offline/world.json"]

# ─── flet build (Linux now; Windows, macOS, Android, iOS from the same code) ───
[tool.flet]
org = "io.github.michalsiman"
# The same id as the Flatpak and the desktop file, so the window gets the app icon.
bundle_id = "io.github.michalsiman.aprs_kiss_app"
product = "APRS & Packet"
company = "OK1SIM"
copyright = "Copyright (c) 2026 Michal Šiman (OK1SIM)"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
# Settings › GPS › "The phone's GPS" (asked for only when chosen)
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true
# Settings › Running in the background: a foreground service (with its notification) keeps the app,
# the radio link and the beacons going while it is not on screen
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_LOCATION" = true
"android.permission.WAKE_LOCK" = true
"android.permission.POST_NOTIFICATIONS" = true
# Settings › Connection › TNC over Bluetooth: Android 12+ asks for "Nearby devices" (BLUETOOTH_CONNECT);
# older Android versions need BLUETOOTH
"android.permission.BLUETOOTH_CONNECT" = true
"android.permission.BLUETOOTH" = { maxSdkVersion = "30" }

[tool.flet.ios.info]
NSLocationWhenInUseUsageDescription = "Your position for the map and the APRS beacon, when Settings › GPS uses the phone's GPS."

# Android: pyjnius reaches the USB host API for a TNC on the phone's USB port (aprs_kiss_core/android_usb.py)
[tool.flet.android]
dependencies = ["pyjnius"]
# The launcher icon: assets/icon_android.png is the icon blue to the edges (Android masks it to its own
# shape), so no white margin around it; this colour is behind it, the blue of the icon's middle.
adaptive_icon_background = "#3D46B2"
# Google Play takes only apps aimed at a recent Android (API 36 = Android 16 in 2026)
target_sdk_version = 36

[tool.flet.android.feature]
"android.hardware.usb.host" = false  # used when present, not required
"android.hardware.location.gps" = false  # the phone GPS is optional too
"android.hardware.bluetooth" = false  # and Bluetooth
